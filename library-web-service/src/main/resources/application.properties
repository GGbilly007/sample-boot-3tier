# ---------------------------------------------------------------------------
# Local MySQL connection
#
# Before you run this app, the database and the user must already exist:
#
#   CREATE DATABASE spring_db;
#   CREATE USER 'spring_user'@'localhost' IDENTIFIED BY '1234abcd';
#   GRANT ALL PRIVILEGES ON spring_db.* TO 'spring_user'@'localhost';
#   FLUSH PRIVILEGES;
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/spring_2026?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=springuser_2026
spring.datasource.password=1234abcd
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Print every SQL statement Hibernate runs, so you can see what JPA does for you.
spring.jpa.show-sql=true

# Hibernate must NOT create the tables. schema.sql already creates them, which
# means your @Entity annotations have to match tables that already exist.
spring.jpa.hibernate.ddl-auto=create-drop

# Run schema.sql and then data.sql on every startup.
spring.datasource.initialization-mode=always

# A field maps to a column with exactly the same name:
#   field addedDate  -> column ADDEDDATE   (not ADDED_DATE)
#   @ManyToOne field category -> column CATEGORY_ID
# Because the column names in schema.sql were chosen to match the field names,
# this project needs no @Column or @JoinColumn annotations.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Keep the Hibernate session open while the controller writes the JSON response,
# so lazy @OneToMany collections can still be read there.
spring.jpa.open-in-view=true